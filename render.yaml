services:
  # 1. Python ML Service (Flask / PyTorch PINN / ONNX Telematics)
  - type: web
    name: lifecharge-ml-service
    env: python
    region: singapore
    plan: free
    rootDir: ml-service
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 8000

  # 2. Node.js Express Backend API & WebSockets
  - type: web
    name: lifecharge-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: lifecharge-ml-service
          property: host

  # 3. Frontend React App (Vite SPA) - Global CDN Static Site
  - type: web
    name: lifecharge-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
